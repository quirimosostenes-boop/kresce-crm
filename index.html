block;margin-bottom:4px}.pipe-item small{color:var(--muted)}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:15px}.search{position:relative;flex:1;min-width:190px}.search input{width:100%;padding:10px 12px 10px 36px;border:1px solid var(--line);border-radius:9px;background:#fff;outline:none}.search:before{content:"⌕";position:absolute;left:12px;top:5px;font-size:22px;color:#888}.select{padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;color:#333}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;white-space:nowrap}.table th{text-align:left;font-size:10px;letter-spacing:.6px;text-transform:uppercase;color:#888;padding:12px;border-bottom:1px solid var(--line)}.table td{padding:13px 12px;border-bottom:1px solid #f0f1f2;font-size:12px}.table tr:last-child td{border-bottom:0}.person{display:flex;align-items:center;gap:9px}.initial{width:31px;height:31px;background:#eff8df;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:11px}.person b{display:block;font-size:12px}.person small{color:var(--muted)}.badge{display:inline-block;padding:5px 8px;border-radius:20px;font-size:10px;font-weight:700;background:#f0f1f2;color:#555}.badge.green{background:#e9f8e9;color:#167344}.badge.yellow{background:#fff5dc;color:#99650b}.badge.red{background:#ffeded;color:#b43b3b}.badge.lime{background:#f0fbdc;color:#557c00}.empty{text-align:center;padding:35px;color:var(--muted)}.actions{display:flex;gap:5px}.icon-btn{border:0;background:#f5f6f7;border-radius:7px;padding:6px 8px}.task{display:flex;align-items:flex-start;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.task:last-child{border:0}.task input{accent-color:#8bd000;margin-top:3px}.task b{font-size:12px;display:block}.task small{color:var(--muted)}.task.done b{text-decoration:line-through;color:#999}.progress{height:7px;background:#edf0e8;border-radius:9px;overflow:hidden}.progress span{display:block;height:100%;background:v function dashboard(){let revenue=db.payments.reduce((s,x)=>s+Number(x.amount||0),0),open=db.proposals.filter(x=>x.status==='Enviada'||x.status==='Em negociação').length,active=db.leads.filter(x=>x.stage!=='Convertido'&&x.stage!=='Perdido').length,month=new Date().getMonth();let monthly=Array.from({length:6},(_,i)=>{let d=new Date();d.setMonth(d.getMonth()-5+i);return {label:d.toLocaleDateString('pt-PT',{month:'short'}),value:db.payments.filter(x=>{let q=new Date(x.date||today());return q.getMonth()===d.getMonth()&&q.getFullYear()===d.getFullYear()}).reduce((s,x)=>s+Number(x.amount||0),0)}});let max=Math.max(1,...monthly.map(x=>x.value));let tasks=db.tasks.filter(x=>!x.done).sort((a,b)=>(a.due||'').localeCompare(b.due||'')).slice(0,5);
return pageHead('Bom dia! 👋','Aqui está o resumo da actividade comercial da Kresce Ads.',`<button class="btn primary" onclick="openForm('lead')">＋ Novo potencial cliente</button>`)+
`<div class="cards">${stat('Total de clientes',db.clients.length,'♙','Clientes cadastrados')}${stat('Potenciais clientes',active,'◎','Oportunidades em aberto')}${stat('Propostas em aberto',open,'▤','Enviadas ou em negociação')}${stat('Receita registada',money(revenue),'◈','Pagamentos registados')}</div>
<div class="grid2"><div class="panel"><div class="panel-head"><h3>Receitas dos últimos 6 meses</h3><span class="muted" style="font-size:11px">Valores em MZN</span></div><div class="chart">${monthly.map(x=>`<div class="bar-wrap"><span class="bar-value">${x.value?Math.round(x.value/1000)+'k':''}</span><div class="bar" style="height:${Math.max(2,x.value/max*76)}%"></div><span class="bar-label">${x.label}</span></div>`).join('')}</div></div>
<div class="panel"><div class="panel-head"><h3>Próximas tarefas</h3><button class="btn small" onclick="go('tasks')">Ver todas</button></div>${tasks.length?tasks.map(t=>`<div class="task"><input type="checkbox" onchange="toggleTask('${t.id}')"><div><b>${esc(t.title)}</b><small>${esc(t.due||'Sem data')} · ${esc(t.client||'Sem cliente')}</small></div></div>`).join(''):empty('Não há tarefas pendentes.')}</div></div>
<div class="panel"><div class="panel-head"><h3>Acesso rápido</h3><span class="muted" style="font-size:11px">Registos mais utilizados</span></div><div class="quick-grid"><button class="quick" onclick="openForm('client')"><span>♙</span><b>Novo cliente</b><small>Cadastrar contacto</small></button><button class="quick" onclick="openForm('lead')"><span>◎</span><b>Novo lead</b><small>Registar oportunidade</small></button><button class="quick" onclick="openForm('task')"><span>✓</span><b>Nova tarefa</b><small>Agendar acompanhamento</small></button></div></div>`}
function toolbar(placeholder,filter=''){return `<div class="toolbar"><div class="search"><input id="tableSearch" placeholder="${placeholder}" oninput="filterTable()"></div>${filter}</div>`}
function tableRows(kind){let rows=db[kind],type=kind;let head=kind==='clients'?['Cliente','Telefone','Email','Empresa','Localização','']:kind==='leads'?['Potencial cliente','Contacto','Origem','Etapa','Valor estimado','']:kind==='proposals'?['Proposta','Cliente','Valor','Data','Estado','']:kind==='payments'?['Descrição','Cliente','Valor','Data','Método','']:['Tarefa','Cliente','Prazo','Prioridade','Estado',''];let body=rows.map(r=>{let name=r.name||r.title||r.description||'—';let secondary=r.company||r.email||r.phone||'';let cells=kind==='clients'?`<td><div class="person"><span class="initial">${esc(name.slice(0,2).toUpperCase())}</span><div><b>${esc(name)}</b><small>${esc(secondary)}</small></div></div></td><td>${esc(r.phone)}</td><td>${esc(r.email)}</td><td>${esc(r.company)}</td><td>${esc(r.location)}</td>`:kind==='leads'?`<td><b>${esc(name)}</b><br><small class="muted">${esc(r.company||'')}</small></td><td>${esc(r.phone)}</td><td>${esc(r.source)}</td><td><span class="badge ${r.stage==='Convertido'?'green':r.stage==='Perdido'?'red':'lime'}">${esc(r.stage)}</span></td><td>${money(r.value)}</td>`:kind==='proposals'?`<td><b>${esc(name)}</b></td><td>${esc(r.client)}</td><td>${money(r.amount)}</td><td>${esc(r.date)}</td><td><span class="badge ${r.status==='Aprovada'?'green':r.status==='Recusada'?'red':'yellow'}">${esc(r.status)}</span></td>`:kind==='payments'?`<td><b>${esc(name)}</b></td><td>${esc(r.client)}</td><td>${money(r.amount)}</td><td>${esc(r.date)}</td><td>${esc(r.method)}</td>`:`<td><b>${esc(name)}</b></td><td>${esc(r.client)}</td><td>${esc(r.due)}</td><td>${esc(r.priority)}</td><td><span class="badge ${r.done?'green':'yellow'}">${r.done?'Concluída':'Pendente'}</span></td>`;return `<tr data-search="${esc([name,secondary,r.phone,r.email,r.company,r.client,r.stage,r.status,r.source].join(' ').toLowerCase())}">${cells}<td><div class="actions"><button class="icon-btn" title="Editar" onclick="editRecord('${kind}','${r.id}')">✎</button><button class="icon-btn" title="Eliminar" onclick="deleteRecord('${kind}','${r.id}')">×</button></div></td></tr>`}).join('');
return `<div class="panel table-wrap"><table class="table"><thead><tr>${head.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody id="tableBody">${body}</tbody></table>${rows.length?'':empty('Ainda não existem registos. Clique em “Adicionar” para começar.')}</div>`}
function listing(kind,title,sub,placeholder,form){return pageHead(title,sub,`<button class="btn primary" onclick="openForm('${form}')">＋ Adicionar</button>`)+toolbar(placeholder)+tableRows(kind)}
function pipeline(){let stages=['Novo contacto','Em atendimento','Proposta enviada','Em negociação','Convertido','Perdido'];return pageHead('Funil de vendas','Acompanhe cada oportunidade desde o primeiro contacto até à venda.')+`<div class="pipeline">${stages.map(s=>{let items=db.leads.filter(x=>x.stage===s);return `<div class="pipe-col"><h4>${s} <span style="float:right">${items.length}</span></h4>${items.map(x=>`<div class="pipe-item"><b>${esc(x.name)}</b><small>${esc(x.company||x.phone||'')}</small><div style="margin-top:7px;font-weight:700">${money(x.value)}</div><button class="btn small" style="margin-top:8px" onclick="editRecord('leads','${x.id}')">Actualizar</button></div>`).join('')||'<small class="muted">Sem oportunidades</small>'}</div>`}).join('')}</div>`}
function finance(){let total=db.payments.reduce((s,x)=>s+Number(x.amount||0),0),pending=db.proposals.filter(x=>x.status!=='Aprovada'&&x.status!=='Recusada').reduce((s,x)=>s+Number(x.amount||0),0);return pageHead('Financeiro','Registe recebimentos e acompanhe os valores comerciais.',`<button class="btn primary" onclick="openForm('payment')">＋ Registar pagamento</button>`)+`<div class="cards">${stat('Total recebido',money(total),'◈','Pagamentos registados')}${stat('Propostas em aberto',money(pending),'▤','Valor potencial')}</div>`+toolbar('Pesquisar pagamentos...')+tableRows('payments')}
function reports(){let won=db.leads.filter(x=>x.stage==='Convertido').length,all=db.leads.length,conv=all?Math.round(won/all*100):0,paid=db.payments.reduce((s,x)=>s+Number(x.amount||0),0);return pageHead('Relatórios','Indicadores para acompanhar a evolução comercial.')+`<div class="report-grid"><div class="report-box"><span class="muted">Taxa de conversão</span><strong>${conv}%</strong><div class="progress"><span style="width:${conv}%"></span></div></div><div class="report-box"><span class="muted">Clientes cadastrados</span><strong>${db.clients.length}</strong><small class="muted">Base de clientes</small></div><div class="report-box"><span class="muted">Receita registada</span><strong>${money(paid)}</strong><small class="muted">Total de pagamentos</small></div></div><div class="panel" style="margin-top:16px"><div class="panel-head"><h3>Exportar dados</h3></div><p class="muted">Descarregue uma cópia dos seus registos para abrir numa folha de cálculo.</p><div class="toolbar"><button class="btn" onclick="exportCSV('clients')">Exportar clientes CSV</button><button class="btn" onclick="exportCSV('leads')">Exportar leads CSV</button><button class="btn" onclick="exportCSV('payments')">Exportar pagamentos CSV</button><button class="btn dark" onclick="backup()">Criar cópia de segurança</button><label class="btn">Restaurar cópia<input type="file" accept="application/json" hidden onchange="restore(event)"></label></div><p class="footer-note">Os dados desta versão ficam guardados neste navegador e neste dispositivo. Faça cópias de segurança regularmente.</p></div>`}
function tasks(){return pageHead('Tarefas e lembretes','Organize os próximos contactos e compromissos.',`<button class="btn primary" onclick="openForm('task')">＋ Nova tarefa</button>`)+toolbar('Pesquisar tarefas...')+tableRows('tasks')}
function render(){let p=$('#view').dataset.page||'dashboard';$('#view').innerHTML=({dashboard,clients:()=>listing('clients','Clientes','Organize os contactos e o histórico da sua carteira.','Pesquisar por nome, telefone ou empresa...','client'),leads:()=>listing('leads','Potenciais clientes','Registe e acompanhe pessoas ou empresas interessadas.','Pesquisar potenciais clientes...','lead'),pipeline,proposals:()=>listing('proposals','Propostas comerciais','Acompanhe orçamentos e propostas enviados.','Pesquisar propostas...','proposal'),finance,tasks,reports})[p]()}
function filterTable(){let q=($('#tableSearch')?.value||'').toLowerCase();document.querySelectorAll('#tableBody tr').forEach(r=>r.classList.toggle('hidden',!r.dataset.search.includes(q)))}
const schemas={
client:{title:'Novo cliente',kind:'clients',fields:[['name','Nome do cliente','text',1],['company','Empresa','text'],['phone','Telefone / WhatsApp','tel'],['email','Email','email'],['location','Localização','text'],['notes','Notas','textarea']]},
lead:{title:'Novo potencial cliente',kind:'leads',fields:[['name','Nome / contacto','text',1],['company','Empresa','text'],['phone','Telefone / WhatsApp','tel'],['email','Email','email'],['source','Origem do contacto','select',['Instagram','Facebook','WhatsApp','Indicação','Website','Outro']],['stage','Etapa','select',['Novo contacto','Em atendimento','Proposta enviada','Em negociação','Convertido','Perdido']],['value','Valor estimado (MZN)','number'],['notes','Observações','textarea']]},
proposal:{title:'Nova proposta',kind:'proposals',fields:[['name','Título da proposta','text',1],['client','Cliente','text'],['amount','Valor (MZN)','number'],['date','Data','date'],['status','Estado','select',['Rascunho','Enviada','Em negociação','Aprovada','Recusada']],['notes','Descrição / notas','textarea']]},
payment:{title:'Registar pagamento',kind:'payments',fields:[['description','Descrição','text',1],['client','Cliente','text'],['amount','Valor recebido (MZN)','number',1],['date','Data do pagamento','date'],['method','Método','select',['M-Pesa','e-Mola','Transferência bancária','Numerário','Outro']],['notes','Notas','textarea']]},
task:{title:'Nova tarefa',kind:'tasks',fields:[['title','Tarefa','text',1],['client','Cliente relacionado','text'],['due','Data de conclusão','date'],['priority','Prioridade','select',['Baixa','Normal','Alta']],['done','Estado','select',['Pendente','Concluída']],['notes','Notas','textarea']]}
};
let activeSchema=null,editingId=null;
function openForm(type,id=null){activeSchema=schemas[type];editingId=id;let old=id?db[activeSchema.kind].find(x=>x.id===id):{};$('#modalTitle').textContent=(id?'Editar ':'')+activeSchema.title.replace('Novo ','');$('#modalBody').innerHTML=`<div class="form-grid">${activeSchema.fields.map(([key,label,t,reqOrOpts])=>{let opts=Array.isArray(reqOrOpts)?reqOrOpts:null;let value=old?.[key]??(key==='date'?today():key==='due'?today():key==='stage'?'Novo contacto':key==='status'?'Rascunho':key==='priority'?'Normal':key==='done'?'Pendente':'');let control=t==='textarea'?`<textarea name="${key}">${esc(value)}</textarea>`:t==='select'?`<select name="${key}">${opts.map(o=>`<option ${value===o?'selected':''}>${o}</option>`).join('')}</select>`:`<input name="${key}" type="${t}" value="${esc(value)}" ${reqOrOpts===1?'required':''} ${t==='number'?'min="0" step="0.01"':''}>`;return `<div class="field ${t==='textarea'?'full':''}"><label>${label}${reqOrOpts===1&&!opts?' *':''}</label>${control}</div>`}).join('')}</div>`;$('#modalBack').classList.add('show')}
function editRecord(kind,id){let map={clients:'client',leads:'lead',proposals:'proposal',payments:'payment',tasks:'task'};openForm(map[kind],id)}

$('#recordForm').onsubmit=e=>{e.preventDefault();let obj=Object.fromEntries(new FormData(e.target).entries());if(obj.value!==undefined)obj.value=Number(obj.value||0);if(obj.amount!==undefined)obj.amount=Number(obj.amount||0);if(obj.done)obj.done=obj.done==='Concluída';let arr=db[activeSchema.kind];if(editingId){let i=arr.findIndex(x=>x.id===editingId);arr[i]={...arr[i],...obj}}else arr.unshift({id:uid(),...obj});save();closeModal();render();toast('Registo guardado com sucesso.')};
function deleteRecord(kind,id){if(!confirm('Tem a certeza de que pretende eliminar este registo?'))return;db[kind]=db[kind].filter(x=>x.id!==id);save();render();toast('Registo eliminado.')}
function toggleTask(id){let t=db.tasks.find(x=>x.id===id);if(t){t.done=!t.done;save();render()}}
function exportCSV(kind){let rows=db[kind];if(!rows.length){toast('Não existem dados para exportar.');return}let keys=[...new Set(rows.flatMap(Object.keys))],csv=[keys.join(';'),...rows.map(r=>keys.map(k=>'"'+String(r[k]??'').replace(/"/g,'""')+'"').join(';'))].join('\n');download('\ufeff'+csv,`kresce-${kind}.csv`,'text/csv;charset=utf-8')}
function backup(){download(JSON.stringify(db,null,2),'kresce-crm-backup.json','application/json')}
function restore(e){let f=e.target.files[0];if(!f)return;let reader=new FileReader();reader.onload=()=>{try{let x=JSON.parse(reader.result);Object.keys(db).forEach(k=>db[k]=Array.isArray(x[k])?x[k]:[]);save();render();toast('Cópia restaurada.')}catch{toast('Ficheiro de cópia inválido.')}};reader.readAsText(f)}
function download(data,name,type){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([data],{type}));a.href=url;a.download=name;a.click();URL.revokeObjectURL(url)}
render();

<script>
let deferredInstallPrompt = null;
const installButton = document.getElementById('installBtn');
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
}
window.addEventListener('beforeinstallprompt', (event) => {
  event.preventDefault();
  deferredInstallPrompt = event;
  if (installButton) installButton.style.display = 'inline-flex';
});
if (installButton) installButton.addEventListener('click', async () => {
  if (!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice;
  deferredInstallPrompt = null;
  installButton.style.display = 'none';
});
window.addEventListener('appinstalled', () => {
  if (installButton) installButton.style.display = 'none';
});
</script>
